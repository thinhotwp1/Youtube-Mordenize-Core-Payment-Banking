    FINOPS:['FinOps','value','Finance, engineering and product use agreed cost data to inform, optimise and govern decisions. The bank sets the cadence.'],

    SPLITEKS:['Pod cost estimate','value','CPU and memory usage can inform allocation; reservations and idle capacity still need a Finance-approved rule.'],
    SHOWBACK:['Showback','value','A team cost view without charging budgets. It supports decisions but does not itself prove savings or behaviour change.'],
    RIGHTSIZE:['Rightsizing','cost','Making servers and containers the right size for real use. Too big wastes money; too small breaks NFRs.'],
    GRAVITON:['Graviton','cost','AWS Arm processors. Any price or performance gain depends on workload compatibility and the bank’s rates; benchmark first.'],
    SAVPLAN:['Savings Plans','cost','A commitment to a steady level of spend for one or three years, in return for a lower price.'],
    SPOT:['Spot capacity','cost','Spare AWS capacity at a big discount, which AWS can take back at short notice. Fine for tests, not for live payments.'],
    LOGRET:['Log retention','risk','Bank legal, risk and operations set retention and access needs before storage-tier changes.'],
    MSU:['MSU vs MIPS','cost','Mainframe capacity measures. A workload change does not automatically reduce a contract charge; verify the actual basis.'],
    R4HA:['Rolling 4-hour average','cost','One possible billing measure in a mainframe contract. Procurement and the mainframe team confirm whether it applies.'],
    TFP:['Tailored Fit Pricing','cost','An IBM pricing model based on total use instead of the peak. Your contract decides which rules apply.'],
    ZOMBIE:['Residual workload','cost','Legacy programs or jobs may still support other domains. Review dependencies before retirement.'],
    CONTRACT:['Contract renewal','cost','Finance and Procurement model cash effects from actual pricing, commitments and renewal dates.'],
    BUDGETS:['Budget alert','risk','A spend threshold that the bank sets using forecasts and seasonality. The 80% and 100% marks are examples.'],
    ANOMALY:['Cost anomaly','risk','An unusual spend jump requiring investigation. The six-hour alert and same-day fix shown are synthetic test values.'],
    COSTCI:['Cost in CI','value','A tool like Infracost shows the cost change of a Terraform change inside the pull request, before the merge.'],
    FORECAST:['Forecast','value','An estimate based on volume, rates and planned changes, reviewed by Finance with engineering input.'],
    HITL:['Human-in-the-loop','risk','AI may suggest a cause or fix; a named owner checks evidence, tests the change and approves it.'],
    COUNCIL:['FinOps council','value','A monthly meeting of finance, engineering and product. Same numbers, one decision.'],
    CHARGEBACK:['Chargeback','cost','Actually charging each team’s budget for its cloud cost. Usually comes after showback, once the numbers are trusted.'],
    VARIANCE:['Savings vs plan','cost','A comparison of Finance-verified bill changes with a planning hypothesis. Never call an estimate realised savings.'],
    COSTKPI:['Cost KPI','value','A small set of cost numbers reported the same way every quarter, so the trend is clear.'],
    CONTINUOUS:['Continuous modernisation','value','Change never stops: new scheme rules, upgrades, better AI. The topic of EP24.'],
