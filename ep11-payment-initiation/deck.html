function d4(){return [

    ['5',''],
    ['6','  // 1. Seen this key before? Replay the first answer.'],
    ['7','  var existing = payments.find(customer, key);','y'],
    ['8','  if (existing.isPresent())'],

    ['10','  // same key + different body → 422'],
    ['11',''],
    ['12','  // 2. Payment + event in ONE transaction. No Kafka.'],
    ['13','  Payment payment = Payment.initiate(customer, key, hash, cmd);'],
    ['14','  payments.save(payment);','o'],

    ['16','  return PaymentResult.accepted(payment);   // 202'],
