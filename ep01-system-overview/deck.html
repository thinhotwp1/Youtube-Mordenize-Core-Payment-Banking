<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EP01 System Overview</title>
<style>
:root{
  --ink:#222530; --muted:#5E6573; --teal:#0F7F77; --amber:#C9661E; --mustard:#E8B931;
  --red:#C0392B; --green:#2E8B57; --violet:#6D4FD1; --gray:#7B8190; --blue:#2F6FBF;
  --card:rgba(255,252,246,.92); --line:rgba(34,37,48,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#2b2a27;overflow:hidden}
body{font-family:"Segoe UI","Segoe UI Emoji",system-ui,sans-serif;color:var(--ink)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
body.export #viewport{display:block}

/* ---------- stage = the 1920x1080 video frame (beige paper) ---------- */
.stage{width:1920px;height:1080px;position:relative;overflow:hidden;flex:none;
  background:
    radial-gradient(1200px 700px at 6% -12%, #FBF7EF, transparent 62%),
    radial-gradient(1000px 650px at 106% 112%, #E2D2B6, transparent 60%),
    linear-gradient(160deg,#F5EEE2 0%,#EFE6D6 55%,#E7DBC5 100%);}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.grid{position:absolute;inset:0;
  background-image:radial-gradient(rgba(34,37,48,.13) 1px,transparent 1.5px);background-size:24px 24px;
  -webkit-mask-image:radial-gradient(ellipse at center,transparent 38%,#000 90%);mask-image:radial-gradient(ellipse at center,transparent 38%,#000 90%)}
.has-bg .grid{display:none}
.frame{position:absolute;inset:10px;border:1.5px solid rgba(34,37,48,.22);border-radius:24px;pointer-events:none}
.corner{position:absolute;width:46px;height:46px;border:0 solid var(--ink);pointer-events:none}
.c-tl{top:10px;left:10px;border-top-width:3px;border-left-width:3px;border-top-left-radius:24px}
.c-tr{top:10px;right:10px;border-top-width:3px;border-right-width:3px;border-top-right-radius:24px}
.c-bl{bottom:10px;left:10px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:24px}
.c-br{bottom:10px;right:10px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:24px}

/* ---------- header ---------- */
.hdr{position:absolute;left:32px;top:20px;width:1856px;height:84px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px 0 12px;background:rgba(255,252,246,.78);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(90,70,40,.10)}
.brand{display:flex;align-items:center}
.logo{width:64px;height:64px;border-radius:14px;background:#FFFDF8;border:2px solid var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-right:16px;flex:none}
.logo img{width:54px;height:54px;display:block}
.brand .kicker{font-size:14px;font-weight:700;letter-spacing:2.2px;color:var(--teal)}
.brand .ep{font-size:26px;font-weight:700;margin-top:1px}
.brand .ep span{font-weight:400;color:var(--muted)}
.progress{display:flex;gap:8px}
.chip{height:46px;padding:0 14px;white-space:nowrap;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:600;
  border:1.5px solid rgba(34,37,48,.18);color:var(--muted);background:rgba(255,255,255,.55)}
.chip .e{font-size:19px}
.chip.done{color:var(--teal);border-color:rgba(15,127,119,.45)}
.chip.done::after{content:"";margin-left:0}
.chip.now{background:var(--ink);border-color:var(--ink);color:#FFF8EC;box-shadow:0 4px 14px rgba(34,37,48,.30)}
.chip .sub{color:var(--mustard);font-weight:700}

/* ---------- three columns: glossary | diagram | script ---------- */
.panel{position:absolute;top:116px;height:884px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(90,70,40,.13)}
.gloss{left:32px;width:340px;padding:18px 16px 16px;display:flex;flex-direction:column}
.dia-panel{left:384px;width:1072px;padding:0 12px 12px;display:flex;flex-direction:column}
.right{left:1468px;width:420px;padding:18px 18px 18px;display:flex;flex-direction:column}

/* glossary (CXO cheat sheet) */
.g-head .k{font-size:14px;font-weight:800;letter-spacing:2px;color:var(--teal)}
.g-head .s{font-size:13.5px;color:var(--muted);margin-top:2px}
.g-list{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:9px;margin-top:12px}
.g-card{border-radius:12px;padding:9px 12px 10px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-left:5px solid var(--gray);transition:background .25s,box-shadow .25s}
.g-card.value{border-left-color:var(--teal)} .g-card.cost{border-left-color:var(--amber)} .g-card.risk{border-left-color:var(--red)}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-term{font-size:18px;font-weight:800;line-height:1.2}
.g-lens{flex:none;font-size:10.5px;font-weight:800;letter-spacing:1.1px;padding:2px 7px;border-radius:6px;white-space:nowrap}
.g-lens.value{color:#0B5E58;background:rgba(15,127,119,.13)}
.g-lens.cost{color:#8A4310;background:rgba(201,102,30,.14)}
.g-lens.risk{color:#8E2A20;background:rgba(192,57,43,.11)}
.g-card p{font-size:14px;line-height:1.37;color:#3A3F4C;margin-top:4px}
.g-card.on{background:rgba(232,185,49,.24);box-shadow:inset 0 0 0 2px var(--mustard)}

/* diagram panel */
.lp-head{height:66px;padding:12px 10px 0;display:flex;justify-content:space-between;align-items:center;flex:none}
.lp-title{display:flex;align-items:center;gap:14px}
.lp-title .big{font-size:36px;line-height:1}
.lp-title .k{font-size:12.5px;font-weight:700;letter-spacing:1.8px;color:var(--teal)}
.lp-title .t{font-size:25px;font-weight:700;line-height:1.15}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted);align-items:center;white-space:nowrap}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:2px solid}
.legend .tg{background:var(--ink);color:#FFF8EC;font-weight:700;border-radius:10px;padding:1px 9px 1px 4px;font-size:12px}
.legend .tg b{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--mustard);color:var(--ink);text-align:center;line-height:16px;font-size:11px;margin-right:5px}
svg.dia{flex:1;min-height:0;width:100%;display:block}
.demo{flex:none;display:flex;align-items:center;gap:14px;padding:8px 14px;margin-top:6px;
  border-radius:12px;background:rgba(15,127,119,.07);border:1.5px dashed rgba(15,127,119,.45)}
.demo .tagd{flex:none;background:var(--teal);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:1.3px;padding:6px 10px;border-radius:8px}
.demo .lines{font-size:13.5px;line-height:1.42;color:var(--ink)}
.demo .lines b{font-weight:700}
.demo .lines .tf{color:var(--muted)}

/* right panel: script steps */
.rp-head{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;letter-spacing:1.8px;color:var(--teal)}
.rp-head .time{letter-spacing:.5px;color:var(--ink);background:rgba(15,127,119,.10);border:1px solid rgba(15,127,119,.4);padding:4px 10px;border-radius:9px;font-size:13.5px}
.say{margin-top:10px;border-radius:12px;padding:9px 13px;background:rgba(34,37,48,.04);border:1px solid var(--line)}
.say b{display:block;font-size:11.5px;letter-spacing:1.8px;color:var(--muted);margin-bottom:2px}
.say p{font-size:15.5px;line-height:1.33;font-style:italic}
.say.open{border-left:4px solid var(--teal)}
.say.land{border-left:4px solid var(--mustard)}
.steps{list-style:none;flex:1;display:flex;flex-direction:column;justify-content:space-around;margin-top:6px}
.steps li{display:flex;gap:11px;align-items:flex-start;padding:5px 7px;border-radius:10px;border-left:3px solid transparent;transition:background .25s,border-color .25s,opacity .25s}
.steps .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--mustard);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps b{font-size:17px;line-height:1.25;display:block}
.steps p{font-size:14px;line-height:1.32;color:var(--muted);margin-top:1px}
.steps li.on{background:rgba(232,185,49,.20);border-left-color:var(--mustard)}
.steps li.on p{color:var(--ink)}
.stepping .steps li:not(.on){opacity:.5}

/* footer */
.ftr{position:absolute;left:32px;top:1012px;width:1856px;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  background:rgba(255,252,246,.78);border:1px solid var(--line);border-radius:14px;font-size:17px;box-shadow:0 6px 20px rgba(90,70,40,.08)}
.ftr .key b{color:var(--amber);letter-spacing:1.5px;font-size:13px;margin-right:12px}
.ftr .next{color:var(--muted);font-size:15px;display:flex;align-items:center}
.ftr .ep{margin-left:14px;background:var(--ink);color:#FFF8EC;padding:3px 10px;border-radius:8px;font-weight:700;font-size:13px;letter-spacing:1px}

/* SVG diagram text */
svg text{font-family:"Segoe UI","Segoe UI Emoji",sans-serif}
.bt{font-size:16.5px;font-weight:700;text-anchor:middle}
.bs{font-size:13px;fill:#5E6573;text-anchor:middle}
.bsl{font-size:13px;fill:#5E6573}
.gl{font-size:12.5px;font-weight:700;letter-spacing:1.4px}
.lbl{font-size:12.5px;font-weight:600;text-anchor:middle}
.tn{font-size:13.5px;font-weight:800;fill:#222530;text-anchor:middle}
.tt{font-size:14.5px;font-weight:700;fill:#FFF8EC}
.kl{font-size:16px;font-weight:600;fill:#222530}
.kv{font-size:19px;font-weight:800}
.cl{font-size:12px;font-weight:700;letter-spacing:1.3px;fill:#5E6573}
.cv{font-size:17px;font-weight:700;fill:#222530}
.ci{font-size:22px}
.note{font-size:13px;fill:#6E7380;font-style:italic}
.mt{font-size:14px;font-weight:600;text-anchor:middle;fill:#222530}
.hd{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#5E6573}
.bigi{font-size:34px;text-anchor:middle}
.bigt{font-size:22px;font-weight:800;text-anchor:middle;fill:#222530}
.bigs{font-size:15px;text-anchor:middle;fill:#5E6573}

/* live mode hides connector lines so the presenter can draw them */
body.live .conn{display:none}
body.live .conn.show{display:inline}
.tag.on rect{fill:#0F7F77}
.tag.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.7}}

#toast{position:fixed;right:16px;bottom:14px;background:rgba(0,0,0,.75);color:#f1ece2;font:13px "Segoe UI",sans-serif;padding:8px 12px;border-radius:8px;transition:opacity .6s;z-index:9}
body.export #toast{display:none}
</style>
</head>
<body>
<div id="viewport"><div class="stage" id="stage"></div></div>
<div id="toast">← → slide · Space/↓ next step · ↑ prev step · C connectors · A auto-reveal · F fullscreen</div>

<script>
const PARTS=[['💰','Challenge'],['📋','Requirements'],['🏗️','HLD'],['🔄','LLD'],['🤖','AI SDLC'],['⚖️','Trade-offs']];

/* ============================================================
   CXO cheat sheet: business-first definitions (lens = value | cost | risk)
   ============================================================ */
const G={
  MIPS:['MIPS','cost','A mainframe capacity measure. Cost impact depends on the bank’s contract and workload; savings need a baseline and proof of removal.'],
  ISO:['ISO 20022','value','A financial messaging standard. It structures data, but bank and scheme owners still define the business meaning and exception rules.'],
  DB2:['DB2 z/OS','cost','The ledger database in this reference scenario. A bank must verify its real system of record and cost baseline.'],
  TPC:['2PC · Two-Phase Commit','risk','A distributed commit protocol. Holding a transaction across independent services and external parties is often impractical.'],
  P028:['pacs.028','risk','A status inquiry message in relevant ISO 20022 flows. Bank scheme specialists decide when and how it may be used.'],
  C056:['camt.056','risk','A recall request in relevant ISO 20022 flows. It starts a process; it does not guarantee that funds return.'],
  SAGA:['Saga Pattern','risk','Coordinates local steps. Some actions can be reversed; others require a separate bank-approved business process.'],
  COBOL:['CICS · COBOL','risk','Mainframe technologies in this reference estate. Bank specialists validate the implemented rules and their current meaning.'],
  STRANG:['Strangler Fig','risk','A pattern for moving one bounded flow at a time. Routing may reverse; settled external effects need separate handling.'],
  TPS:['TPS','value','Transactions per second: how many payments we can take at the same moment. We size for payroll day, not an average Tuesday.'],
  P99:['p99 latency','value','The wait time for 99 of every 100 customers. Averages hide unhappy customers; p99 shows them.'],
  RPO:['RPO / RTO','risk','Recovery point and recovery time objectives. Zero loss and fifteen minutes are example targets to prove in drills.'],
  IDEM:['Idempotency','risk','If the same payment request arrives twice, the customer is charged once. No duplicate debits, refunds or complaints.'],
  FLAG:['Feature flag','risk','Controls routing for new requests. In-flight state and external effects require a separate fallback plan.'],
  KAFKA:['Kafka (Amazon MSK)','value','An event platform. Contracts, ordering, replay, access and failure handling must be designed and tested.'],
  CDC:['Change Data Capture','cost','Publishes source changes when supported. Completeness, lag and recovery need evidence from the bank’s source system.'],
  ACL:['Anti-Corruption Layer','risk','An adapter between legacy and new contracts. It reduces coupling when its mappings are reviewed and tested.'],
  MICRO:['Microservices on EKS','value','A possible service model. Separate teams gain autonomy only if the bank can operate the added complexity.'],
  SHADOW:['Shadow ledger','risk','A proposed parallel ledger for comparison. Bank accounting owners define posting rules and tolerances.'],
  RECON:['Reconciliation','risk','A repeatable comparison of source and shadow records. Bank owners set cadence, tolerances and exit criteria.'],
  SOR:['System of record','risk','The authoritative record for a defined balance or transaction. The bank identifies it and approves any cutover.'],
  OUTBOX:['Transactional Outbox','risk','Stores state and an event record in one database transaction. Publishing still needs lag monitoring and replay controls.'],
  CATALOG:['Business rules catalog','risk','Candidate rules linked to sources, owners and tests. Bank experts validate meaning and completeness.'],
  ADR:['ADR','risk','Architecture Decision Record: one page per big decision and why it was made. Auditors and future teams see the reasoning, not just the result.'],
  CONTRACT:['API & event contracts','value','Agreed formats for how systems talk. Teams build in parallel, and one team’s change can’t silently break another’s.'],
  AGENTS:['AGENTS.md','risk','An instruction file for coding agents in the proposed reference build. It does not replace human review.'],
  ARCHUNIT:['ArchUnit','risk','Tests for selected Java architecture rules. Bank release approval needs more than an architecture test.'],
  EVENTUAL:['Eventual consistency','value','Systems may disagree briefly. Bank product owners define the customer status and acceptable delay.'],
  PLATFORM:['Platform team','cost','One team runs the shared foundation — Kafka, Kubernetes, Terraform — for everyone. Squads ship faster because they don’t rebuild plumbing.'],
  SFN:['AWS Step Functions','cost','AWS’s managed workflow service, billed per step. Great for low-volume processes; at payment volumes, model the per-step bill first.'],
  DUAL:['Dual-run','cost','Operating old and new paths together. Measure overlapping costs and capacity actually removed.'],
  UETR:['UETR','value','A tracking reference in relevant payment flows. Applicability and tracing rules depend on the scheme.'],
};
const LENS={value:'📈 VALUE',cost:'💰 COST',risk:'🛡️ RISK'};

const K={
  legacy :{s:'#7B8190',f:'rgba(123,129,144,.13)',g:'rgba(123,129,144,.05)',t:'#2A2F3A'},
  aws    :{s:'#0F7F77',f:'rgba(15,127,119,.11)', g:'rgba(15,127,119,.04)', t:'#0B3F3B'},
  risk   :{s:'#C9661E',f:'rgba(201,102,30,.11)', g:'rgba(201,102,30,.04)', t:'#5A2C0B'},
  bad    :{s:'#C0392B',f:'rgba(192,57,43,.09)',  g:'rgba(192,57,43,.04)',  t:'#5C1A13'},
  good   :{s:'#2E8B57',f:'rgba(46,139,87,.11)',  g:'rgba(46,139,87,.04)',  t:'#154A2D'},
  ai     :{s:'#6D4FD1',f:'rgba(109,79,209,.10)', g:'rgba(109,79,209,.04)', t:'#2E1F66'},
  human  :{s:'#2F6FBF',f:'rgba(47,111,191,.10)', g:'rgba(47,111,191,.04)', t:'#163A66'},
  neutral:{s:'#4F5D75',f:'rgba(79,93,117,.09)',  g:'rgba(79,93,117,.04)',  t:'#222530'},
};

const ctx=document.createElement('canvas').getContext('2d');
const tw=(s,font)=>{ctx.font=font;return ctx.measureText(s).width};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- SVG primitives ---------- */
function box(o){
  const c=K[o.k||'neutral'];
  const tl=((o.i?o.i+' ':'')+o.t).split('\n'), sl=o.s?o.s.split('\n'):[];
  const tH=20, sH=16.5, gap=sl.length?4:0, total=tl.length*tH+gap+sl.length*sH;
  let y=o.y+(o.h-total)/2+15; const cx=o.x+o.w/2;
  let out=`<g><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="12" fill="${c.f}" stroke="${c.s}" stroke-width="2"/>`;
  tl.forEach(l=>{out+=`<text class="bt" x="${cx}" y="${y}" fill="${c.t}">${esc(l)}</text>`;y+=tH});
  y+=gap-2;
  sl.forEach(l=>{out+=`<text class="bs" x="${cx}" y="${y}">${esc(l)}</text>`;y+=sH});
  return out+'</g>';
}
function group(o){
  const c=K[o.k||'neutral'];
  const ly=o.lp==='b'?o.y+o.h-12:o.y+24;
  return `<g><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="16" fill="${c.g}" stroke="${c.s}" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="7 6"/>`+
    (o.label?`<text class="gl" x="${o.x+14}" y="${ly}" fill="${c.s}">${esc(o.label)}</text>`:'')+'</g>';
}
function label(x,y,s,k){
  const c=K[k||'neutral'], w=tw(s,'600 12.5px Segoe UI')+16;
  return `<g><rect x="${x-w/2}" y="${y-11}" width="${w}" height="22" rx="11" fill="#FFFBF4" stroke="${c.s}" stroke-width="1.2"/><text class="lbl" x="${x}" y="${y+4.5}" fill="${c.s}">${esc(s)}</text></g>`;
}
function arrow(p,o={}){
  const k=o.k||'neutral', c=K[k];
  const d='M'+p.map(q=>q.join(' ')).join(' L');
  let s=`<g class="conn" data-st="${o.st||0}"><path d="${d}" fill="none" stroke="${c.s}" stroke-width="${o.w||2.6}" stroke-linejoin="round" ${o.dash?'stroke-dasharray="8 6"':''} marker-end="url(#ah-${k})" ${o.both?`marker-start="url(#ah-${k})"`:''}/>`;
  if(o.mid){const a=p[0],b=p[p.length-1];s+=`<text x="${(a[0]+b[0])/2}" y="${(a[1]+b[1])/2+9}" text-anchor="middle" font-size="26" font-weight="800" fill="${c.s}">${o.mid}</text>`}
  s+='</g>';
  if(o.label){
    const a=p[0],b=p[p.length-1];
    s+=label(o.lx??(a[0]+b[0])/2, o.ly??(a[1]+b[1])/2, o.label, k);
  }
  return s;
}
function tag(n,x,y,note,anchor='l'){
  const w=36+tw(note,'700 14.5px Segoe UI')+12;
  const x0=anchor==='l'?x:anchor==='r'?x-w:x-w/2;
  return `<g class="tag" data-st="${n}"><rect x="${x0}" y="${y-14}" width="${w}" height="28" rx="14" fill="#222530" filter="url(#tsh)"/>`+
    `<circle cx="${x0+14}" cy="${y}" r="11" fill="#E8B931"/><text class="tn" x="${x0+14}" y="${y+4.8}">${n}</text>`+
    `<text class="tt" x="${x0+30}" y="${y+5}">${esc(note)}</text></g>`;
}
function kpi(o){
  const c=K[o.k||'aws'];
  return `<g><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="12" fill="${c.f}" stroke="${c.s}" stroke-width="2"/>`+
    `<text class="kl" x="${o.x+18}" y="${o.y+o.h/2+6}">${o.i} ${esc(o.t)}</text>`+
    `<text class="kv" x="${o.x+o.w-18}" y="${o.y+o.h/2+7}" style="text-anchor:end" fill="${c.s}">${esc(o.v)}</text></g>`;
}
function card2(o){
  const c=K[o.k||'aws'];
  return `<g><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="12" fill="${c.f}" stroke="${c.s}" stroke-width="${o.strong?3:2}"/>`+
    `<text class="ci" x="${o.x+14}" y="${o.y+o.h/2+8}">${o.i}</text>`+
    `<text class="cl" x="${o.x+52}" y="${o.y+25}">${esc(o.t)}</text>`+
    `<text class="cv" x="${o.x+52}" y="${o.y+49}">${esc(o.v)}</text></g>`;
}
function mini(o){
  const c=K[o.k||'neutral'];
  return `<g><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="7" fill="#FFFBF4" stroke="${c.s}" stroke-width="1.4"/><text class="mt" x="${o.x+o.w/2}" y="${o.y+o.h/2+5}">${esc(o.t)}</text></g>`;
}
function chevron(o){
  const c=K[o.k||'neutral'], {x,y,w,h}=o, n=18;
  const pts=[[x,y],[x+w-n,y],[x+w,y+h/2],[x+w-n,y+h],[x,y+h],[x+(o.first?0:n),y+h/2]].map(p=>p.join(',')).join(' ');
  return `<g><polygon points="${pts}" fill="${c.f}" stroke="${c.s}" stroke-width="2" stroke-linejoin="round"/>`+
    `<text class="bt" x="${x+w/2+4}" y="${y+h/2-3}" fill="${c.t}" style="font-size:15px">${esc(o.t)}</text>`+
    `<text class="bs" x="${x+w/2+4}" y="${y+h/2+17}">${esc(o.s)}</text></g>`;

function bigcard(o){
  const c=K[o.k||'good'];
  const tl=o.t.split('\n'); let y=o.y+92-(tl.length-1)*13;
  let s=`<g><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="16" fill="${c.f}" stroke="${c.s}" stroke-width="2.4"/>`+
    `<text class="bigi" x="${o.x+o.w/2}" y="${o.y+56}">${o.i}</text>`;
  tl.forEach(l=>{s+=`<text class="bigt" x="${o.x+o.w/2}" y="${y}">${esc(l)}</text>`;y+=27});

}
/* semicircle cost gauge: v = 0 (low) .. 1 (high) */
function gauge(cx,cy,r,v){
  const A=t=>Math.PI*(1-t), pt=(a,rr)=>[cx+rr*Math.cos(a),cy-rr*Math.sin(a)];
  const seg=(t0,t1,col)=>{const [x0,y0]=pt(A(t0),r),[x1,y1]=pt(A(t1),r);return `<path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" fill="none" stroke="${col}" stroke-width="9"/>`};
  const [nx,ny]=pt(A(v),r-12);
  return seg(0,.5,'#2E8B57')+seg(.5,.75,'#E8B931')+seg(.75,1,'#C0392B')+
    `<text x="${cx}" y="${cy-r*.42}" text-anchor="middle" font-size="10" font-weight="800" fill="#5E6573">MIPS</text>`+
    `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#222530" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="#222530"/>`;
}
function gaugeBox(o){
  const c=K[o.k||'risk'];
  let s=`<g><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="12" fill="${c.f}" stroke="${c.s}" stroke-width="2"/>`+
    `<text class="kl" x="${o.x+16}" y="${o.y+30}" style="font-weight:700" fill="${c.t}">${o.i} ${esc(o.t)}</text>`;
  o.cap.forEach((l,i)=>{s+=`<text class="bsl" x="${o.x+16}" y="${o.y+52+i*17}">${esc(l)}</text>`});
  if(o.note) s+=`<text class="note" x="${o.x+16}" y="${o.y+o.h-12}">${esc(o.note)}</text>`;
  return s+gauge(o.x+o.w-(o.r||42)-16,o.y+o.h-14,o.r||42,o.v)+'</g>';
}
const txt=(x,y,s,cls,anchor='start',fill)=>`<text class="${cls}" x="${x}" y="${y}" style="text-anchor:${anchor}" ${fill?`fill="${fill}"`:''}>${esc(s)}</text>`;
function defs(){
  return '<defs>'+Object.entries(K).map(([k,c])=>
    `<marker id="ah-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c.s}"/></marker>`).join('')+

}

  land:'A proposed pipeline can enforce architecture rules.',
  gloss:[['CATALOG',[1,2]],['ADR',[3]],['CONTRACT',[3]],['AGENTS',[5]],['ARCHUNIT',[5,6]]],
  demo:['Proof plan: add ArchUnit, contract and retry tests to a reference build.',
        'No production or benchmark result is claimed by this diagram.'],
  steps:[['AI discovery','AI could draft candidate rules from approved sources.'],
         ['SME sign-off','Every rule links to its COBOL line and test. Experts sign.'],
         ['Contracts & ADRs','AI drafts the contracts and decisions. Architects approve.'],
         ['Java 21 services','Proposed outbox and event-handling checks.'],
         ['Guardrails','Agent instructions plus architecture tests to build.'],
         ['CI gate','Failed checks would block merges; bank gates still apply.'],
         ['Proof plan','Retry request; inspect response, row and event.']]},
 {part:6,kicker:'PART 6 · TRADE-OFFS & TAKEAWAYS',title:'Trade-offs & Takeaways',time:'18:40 – 20:40',draw:d6,
  key:'Bank-owned ledger gate · Defined retries · Test evidence.',next:'🔜 Next: deeper decisions',
  open:'Every architecture is a set of trade-offs. Here are ours.',
  land:'AI drafts; bank experts approve meaning; tests check code.',
  gloss:[['EVENTUAL',[1]],['UETR',[1]],['PLATFORM',[2]],['SFN',[3]],['DUAL',[4]]],
  demo:['Proof plan: compare design options against bank volume, cost and support capacity.',
        'Reference code or sandbox results should state their tested conditions.'],
  steps:[['Eventual consistency','Bank product owner defines visible status.'],
         ['Operational complexity','Kafka, CDC and Sagas need a funded platform team.'],
         ['Orchestration cost','Managed workflows bill per step. Model your volumes first.'],
         ['Dual-run cost','Measure old and new costs and actual removal.'],
         ['Takeaway 1','Ledger cutover needs evidence and bank approval.'],
         ['Takeaway 2','Define idempotency with business owners.'],
         ['Takeaway 3','AI drafts; people approve; tests check.']]},
];
const LAST=SLIDES.length-1;

/* ============================================================
   Rendering
   ============================================================ */
const q=new URLSearchParams(location.search);
const EXPORT=q.has('export');
let cur=Math.max(0,Math.min(LAST,parseInt(q.get('s')??'1',10)||0));
let mode=q.get('mode')||'live';
let step=0, autoReveal=false;
if(EXPORT) document.body.classList.add('export');

function chrome(S){
  const p=S?S.part:0;
  const chips=PARTS.map((x,i)=>{
    const n=i+1, cls=!p?'':n<p?'done':n===p?'now':'';
    const sub=n===p&&S.sub?` <span class="sub">› ${S.sub}</span>`:'';
    return `<div class="chip ${cls}"><span class="e">${x[0]}</span>${n} · ${x[1]}${sub}</div>`;
  }).join('');
  return `<div class="bgimg"></div><div class="grid"></div><div class="frame"></div>
    <div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>
    <header class="hdr"><div class="brand"><div class="logo"><img src="assets/jo-logo.png" alt="JO"></div>
      <div><div class="kicker">🏦 CORE BANKING PAYMENTS MODERNIZATION · AWS</div>
      <div class="ep">${p?'EP 01 · System Overview <span>— Architecture Breakdown</span>':'Architecture Breakdown Series'}</div></div></div>
      <nav class="progress">${chips}</nav></header>`;
}

function render(){
  const st=document.getElementById('stage');
  document.body.classList.toggle('live',mode==='live');
  if(cur===0){ // reusable frame template, empty panels
    st.innerHTML=chrome(null)+`<aside class="panel gloss"></aside><section class="panel dia-panel"></section><aside class="panel right"></aside><footer class="ftr"></footer>`;
    return applyBg();
  }
  const S=SLIDES[cur], e=PARTS[S.part-1][0];
  st.innerHTML=chrome(S)+`
    <aside class="panel gloss">
      <div class="g-head"><div class="k">📖 CXO CHEAT SHEET</div><div class="s">The jargon on this slide, in business terms</div></div>
      <div class="g-list">${S.gloss.map(([k,sts])=>{const [t,l,d]=G[k];
        return `<div class="g-card ${l}" data-st="${sts.join(' ')}"><div class="g-top"><span class="g-term">${t}</span><span class="g-lens ${l}">${LENS[l]}</span></div><p>${d}</p></div>`}).join('')}</div>
    </aside>
    <section class="panel dia-panel">
      <div class="lp-head">
        <div class="lp-title"><span class="big">${e}</span><div><div class="k">${S.kicker}</div><div class="t">${S.title}</div></div></div>
        <div class="legend"><span><i style="border-color:#7B8190;background:rgba(123,129,144,.18)"></i>Legacy</span>
          <span><i style="border-color:#0F7F77;background:rgba(15,127,119,.15)"></i>AWS / new</span>
          <span><i style="border-color:#C9661E;background:rgba(201,102,30,.15)"></i>Risk</span>
          <span class="tg"><b>1</b>Step</span></div>
      </div>
      <svg class="dia" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet">${defs()}${S.draw()}</svg>
      <div class="demo"><span class="tagd">🧪 VALIDATION PLAN</span><div class="lines">
        <div>🖥️ <b>Engineering check:</b> ${S.demo[0]}</div><div class="tf">🛠️ <b>Platform check:</b> ${S.demo[1]}</div></div></div>
    </section>
    <aside class="panel right">
      <div class="rp-head"><span>📝 SCRIPT STEPS</span><span class="time">⏱ ${S.time}</span></div>
      <div class="say open"><b>🎤 OPEN WITH</b><p>“${S.open}”</p></div>
      <ol class="steps">${S.steps.map((x,i)=>`<li data-st="${i+1}"><span class="n">${i+1}</span><div><b>${x[0]}</b><p>${x[1]}</p></div></li>`).join('')}</ol>
      <div class="say land"><b>🎯 LAND</b><p>“${S.land}”</p></div>
    </aside>
    <footer class="ftr"><div class="key"><b>💡 KEY MESSAGE</b>${S.key}</div><div class="next">${S.next}<span class="ep">EP 01</span></div></footer>`;
  applyStep(); applyBg();
}

function applyStep(){
  const st=document.getElementById('stage');
  st.classList.toggle('stepping',step>0);
  st.querySelectorAll('.steps li').forEach(li=>li.classList.toggle('on',+li.dataset.st===step));
  st.querySelectorAll('.tag').forEach(t=>t.classList.toggle('on',+t.dataset.st===step));
  st.querySelectorAll('.g-card').forEach(g=>g.classList.toggle('on',step>0&&g.dataset.st.split(' ').map(Number).includes(step)));
  st.querySelectorAll('.conn').forEach(c=>c.classList.toggle('show',autoReveal&&+c.dataset.st<=step));
}

let bgUrl=null;
function applyBg(){
  if(bgUrl) document.querySelectorAll('.bgimg').forEach(b=>b.style.backgroundImage=`url("${bgUrl}")`);
  document.getElementById('stage').classList.toggle('has-bg',!!bgUrl);
}
const probe=new Image();
probe.onload=()=>{bgUrl=probe.src;applyBg()};
probe.src='assets/background.png';

function fit(){
  if(EXPORT) return;
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  document.getElementById('stage').style.transform=`scale(${s})`;
}
addEventListener('resize',fit);

addEventListener('keydown',ev=>{
  if(EXPORT) return;
  const maxStep=cur?SLIDES[cur].steps.length:0;
  switch(ev.key){
    case 'ArrowRight': case 'PageDown': if(cur<LAST){cur++;step=0;render()} break;
    case 'ArrowLeft':  case 'PageUp':   if(cur>1){cur--;step=0;render()} break;
    case ' ': case 'ArrowDown': ev.preventDefault(); if(step<maxStep){step++;applyStep()} break;
    case 'ArrowUp': if(step>0){step--;applyStep()} break;
    case 'c': case 'C': mode=mode==='live'?'ref':'live'; document.body.classList.toggle('live',mode==='live'); break;
    case 'a': case 'A': autoReveal=!autoReveal; applyStep(); break;
    case 'f': case 'F': document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); break;
    case 't': case 'T': cur=cur===0?1:0; step=0; render(); break;
    default: return;
  }
  history.replaceState(null,'',`?s=${cur}&mode=${mode}`);
});

render(); fit();
setTimeout(()=>{const t=document.getElementById('toast');if(t)t.style.opacity=0},4000);
</script>
</body>
</html>
